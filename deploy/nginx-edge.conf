# Internal splitter for Coolify. Not TLS and not bound to 80/443.
# Traefik sends every request for pbx.opps.dev to :9080.
# JsSIP connects to wss://pbx.opps.dev/ws; that path is Asterisk, not the app.
# /ari stays on 127.0.0.1:8088 and is never forwarded.

map $http_upgrade $connection_upgrade {
	default upgrade;
	''      close;
}

server {
	listen 9080;
	server_name _;

	# Exact path, same as Caddy's `path /ws`. JsSIP dials wss://<domain>/ws.
	location = /ws {
		proxy_pass http://127.0.0.1:8088;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
		proxy_buffering off;
		proxy_read_timeout 3600s;
		proxy_send_timeout 3600s;
	}

	location / {
		proxy_pass http://127.0.0.1:3000;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
		proxy_buffering off;
		proxy_read_timeout 3600s;
		proxy_send_timeout 3600s;
		# Greeting uploads are capped at 15 MB in the API.
		client_max_body_size 20m;
	}
}
