# Typecheck and unit tests. Self-hosted macOS only — do not add a
# GitHub-hosted runner (ubuntu-latest and the rest). No Docker.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json
      - name: Server typecheck and tests
        working-directory: server
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Web typecheck
        working-directory: web
        run: |
          npm ci
          npx tsc --noEmit -p tsconfig.json
