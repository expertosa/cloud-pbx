# Cloud PBX — single-server deployment.
# Asterisk and the API use the host network: SIP and RTP need real ports,
# and ARI stays on 127.0.0.1 where only the API and Caddy can reach it.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: cloudpbx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: cloudpbx
    volumes:
      - db:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudpbx"]
      interval: 5s
      retries: 20

  asterisk:
    build:
      context: .
      dockerfile: asterisk/Dockerfile
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      ASTERISK_HTTP_BIND: 127.0.0.1
    volumes:
      - astdb:/var/lib/asterisk
      - recordings:/var/spool/asterisk/recording
      - sounds:/data/sounds:ro

  app:
    build: .
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      DATABASE_URL: postgres://cloudpbx:${POSTGRES_PASSWORD}@127.0.0.1:5432/cloudpbx
      ARI_URL: http://127.0.0.1:8088/ari
      HOST: 127.0.0.1
    volumes:
      - recordings:/var/spool/asterisk/recording:ro
      - sounds:/data/sounds
    depends_on:
      db:
        condition: service_healthy
      asterisk:
        condition: service_started

  caddy:
    image: caddy:2
    restart: unless-stopped
    network_mode: host
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data

volumes:
  db:
  astdb:
  recordings:
  sounds:
  caddy:
