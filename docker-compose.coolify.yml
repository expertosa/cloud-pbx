# Coolify / Traefik on the same host (pbx.opps.dev, hetzner-hel1).
#
# Use this file instead of docker-compose.yml. Do not run both.
# The standalone file stays as-is for a VPS where Caddy owns 80/443.
#
# Coolify: Docker Compose build pack, compose location /docker-compose.coolify.yml.
# Leave the resource domain empty and turn off "Connect To Predefined Network".
# Host-network services have no address on the coolify network, so Traefik
# labels return 503. Routing is deploy/coolify-traefik.yaml (one route to :9080).
#
# Why an edge proxy exists: the panel listens on 127.0.0.1:3000 and Asterisk
# HTTP (ARI + SIP WebSocket /ws) on 127.0.0.1:8088. Coolify's Traefik is a
# container, so 127.0.0.1 inside it is not this host. edge is nginx on the
# host network, port 9080 only. It forwards /ws to Asterisk and every other
# path to the app, and it does not publish /ari. Caddy is not started, so
# Traefik keeps 80/443.
#
#   docker compose --env-file .env -f docker-compose.coolify.yml up -d --build

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: cloudpbx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: cloudpbx
    volumes:
      - db:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudpbx"]
      interval: 5s
      retries: 20

  asterisk:
    build:
      context: .
      dockerfile: asterisk/Dockerfile
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      ASTERISK_HTTP_BIND: 127.0.0.1
    volumes:
      - astdb:/var/lib/asterisk
      - recordings:/var/spool/asterisk/recording
      - sounds:/data/sounds:ro

  app:
    build: .
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      DATABASE_URL: postgres://cloudpbx:${POSTGRES_PASSWORD}@127.0.0.1:5432/cloudpbx
      ARI_URL: http://127.0.0.1:8088/ari
      HOST: 127.0.0.1
    volumes:
      - recordings:/var/spool/asterisk/recording:ro
      - sounds:/data/sounds
    depends_on:
      db:
        condition: service_healthy
      asterisk:
        condition: service_started

  # HTTP only. Traefik terminates TLS for pbx.opps.dev and proxies here.
  edge:
    image: nginx:1.27-alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./deploy/nginx-edge.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_started
      asterisk:
        condition: service_started

volumes:
  db:
  astdb:
  recordings:
  sounds:
