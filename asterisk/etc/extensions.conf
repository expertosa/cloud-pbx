; All call logic lives in the Cloud PBX API (ARI app "cloudpbx").
; The dialplan only hands calls over to it.
[general]
static = yes
writeprotect = yes

[globals]

; Calls arriving from the carrier (Telnyx). The DID may be in the
; Request-URI (IP-auth connections) or only in the To header
; (registration-based connections), so both are passed on.
[from-trunk]
exten => _[+0-9a-zA-Z].,1,NoOp(Inbound ${EXTEN} from ${CALLERID(num)})
 same => n,Set(TO_USER=${CUT(CUT(PJSIP_HEADER(read,To),@,1),:,2)})
 same => n,Stasis(cloudpbx,inbound,${EXTEN},${TO_USER})
 same => n,Hangup()
exten => s,1,Set(TO_USER=${CUT(CUT(PJSIP_HEADER(read,To),@,1),:,2)})
 same => n,Stasis(cloudpbx,inbound,s,${TO_USER})
 same => n,Hangup()

; Calls placed by tenant extensions (browser phone, softphones, desk phones).
[from-internal]
exten => _[*#+0-9].,1,Stasis(cloudpbx,internal,${EXTEN})
 same => n,Hangup()
exten => _[*#+0-9],1,Stasis(cloudpbx,internal,${EXTEN})
 same => n,Hangup()

; Outbound legs created by the API are placed directly on channels,
; this context is a safe sink for anything unexpected.
[cloudpbx-sink]
exten => _X.,1,Hangup()
