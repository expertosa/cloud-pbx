; All call logic lives in the Cloud PBX API (ARI app "cloudpbx").
; The dialplan only hands calls over to it.
[general]
static = yes
writeprotect = yes

[globals]

; Calls arriving from the carrier (Telnyx). The DID may be in the
; Request-URI (IP-auth connections) or only in the To header
; (registration-based connections), so both are passed on.
[from-trunk]
exten => _[+0-9a-zA-Z].,1,NoOp(Inbound ${EXTEN} from ${CALLERID(num)})
 same => n,Set(TO_USER=${CUT(CUT(PJSIP_HEADER(read,To),@,1),:,2)})
 same => n,Stasis(cloudpbx,inbound,${EXTEN},${TO_USER})
 same => n,Hangup()
exten => s,1,Set(TO_USER=${CUT(CUT(PJSIP_HEADER(read,To),@,1),:,2)})
 same => n,Stasis(cloudpbx,inbound,s,${TO_USER})
 same => n,Hangup()

; Calls placed by tenant extensions (browser phone, softphones, desk phones).
[from-internal]
exten => _[*#+0-9].,1,Stasis(cloudpbx,internal,${EXTEN})
 same => n,Hangup()
exten => _[*#+0-9],1,Stasis(cloudpbx,internal,${EXTEN})
 same => n,Hangup()

; Outbound legs created by the API are placed directly on channels,
; this context is a safe sink for anything unexpected.
[cloudpbx-sink]
exten => _X.,1,Hangup()

; AI receptionist transfer. The API originates Local/<endpoint>@receptionist-handoff/n
; with RECEPTIONIST_* set on the ;1 channel (ARI originate variables land there).
; This side imports them and dials the real PJSIP endpoint. The pre-dial
; subroutine runs on the PJSIP channel, so the headers are on the INVITE
; that Callolo and the browser phone see. /n on the Local channel keeps the
; leg id stable after the call is bridged.
[receptionist-handoff]
exten => _[A-Za-z0-9_-].,1,NoOp(Receptionist handoff to ${EXTEN})
 same => n,Set(PEER=${CHANNEL(name)})
 same => n,Set(PEER=${PEER:0:-1}1)
 same => n,Set(RCALL=${IMPORT(${PEER},RECEPTIONIST_CALL)})
 same => n,Set(RSUM=${IMPORT(${PEER},RECEPTIONIST_SUMMARY)})
 same => n,Set(CNAME=${IMPORT(${PEER},RECEPTIONIST_CID_NAME)})
 same => n,Set(CNUM=${IMPORT(${PEER},RECEPTIONIST_CID_NUM)})
 same => n,Set(RTIME=${IMPORT(${PEER},RECEPTIONIST_TIMEOUT)})
 same => n,ExecIf($["${RTIME}" = ""]?Set(RTIME=25))
 same => n,ExecIf($["${CNUM}" != ""]?Set(CALLERID(num)=${CNUM}))
 same => n,ExecIf($["${CNAME}" != ""]?Set(CALLERID(name)=${CNAME}))
 same => n,Set(_RECEPTIONIST_CALL=${RCALL})
 same => n,Set(_RECEPTIONIST_SUMMARY=${RSUM})
 same => n,Dial(PJSIP/${EXTEN},${RTIME},b(receptionist-predial^s^1))
 same => n,Hangup()

[receptionist-predial]
exten => s,1,ExecIf($["${RECEPTIONIST_CALL}" != ""]?Set(PJSIP_HEADER(add,X-Receptionist-Call)=${RECEPTIONIST_CALL}))
 same => n,ExecIf($["${RECEPTIONIST_SUMMARY}" != ""]?Set(PJSIP_HEADER(add,X-Receptionist-Summary)=${RECEPTIONIST_SUMMARY}))
 same => n,Return()
