[global]
type = global
user_agent = CloudPBX
endpoint_identifier_order = ip,username,anonymous
max_initial_qualify_time = 4
keep_alive_interval = 30

[system]
type = system
timer_t1 = 500
timer_b = 32000

; ---- Transports -------------------------------------------------
[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:${SIP_PORT}
external_media_address = ${EXTERNAL_IP}
external_signaling_address = ${EXTERNAL_IP}
${LOCAL_NET_LINES}

[transport-tcp]
type = transport
protocol = tcp
bind = 0.0.0.0:${SIP_PORT}
external_media_address = ${EXTERNAL_IP}
external_signaling_address = ${EXTERNAL_IP}
${LOCAL_NET_LINES}

; SIP over WebSocket for the browser phone (served by http.conf on /ws)
[transport-ws]
type = transport
protocol = ws
bind = 0.0.0.0

; ---- Carrier trunk (rendered from env) ---------------------------
#include pjsip_trunk.conf
