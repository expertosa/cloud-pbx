; Static objects (transports, trunk) come from pjsip.conf.
; Tenant extensions are pushed by the API through ARI dynamic config
; and persisted in AstDB, so they survive restarts.
[res_pjsip]
endpoint = config,pjsip.conf,criteria=type=endpoint
endpoint = astdb,cloudpbx_endpoint
auth = config,pjsip.conf,criteria=type=auth
auth = astdb,cloudpbx_auth
aor = config,pjsip.conf,criteria=type=aor
aor = astdb,cloudpbx_aor

[res_pjsip_endpoint_identifier_ip]
identify = config,pjsip.conf,criteria=type=identify
